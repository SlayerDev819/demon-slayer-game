<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tower Defense: Zombie Outbreak ULTIMATE</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #0b0e14;
            color: #fff;
            font-family: 'Segoe UI', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;

            text-align: center;
        }
        .game {
            max-width: 880px;

        }

            grid-template-columns: 1fr 1fr 1fr 1fr 1fr;

        .btn-red {

        }
        .btn-red:hover {

        .btn-purple {

        .btn-purple:hover {

        }
        .btn-pink {
            background: #ff66aa;

        }

        }

            background: #44aaff;

        .shop {

        .tabs {

        }
        .tabs button {
            background: #0b0e14;
            border: 1px solid #1e2838;
            color: #aaa;
            padding: 6px 12px;
            border-radius: 12px;
            font-size: 12px;
            cursor: pointer;
            transition: 0.3s;
            flex: 1;
        }
        .tabs button:hover {
            border-color: #44cc88;
            color: #fff;
        }
        .tabs button.active {
            background: #44cc88;
            color: #0b0e14;
            border-color: #44cc88;
            font-weight: bold;
        }
        .tab-content {
            display: none;
        }
        .tab-content.active {

        .upgrade-item {
            background: #0b0e14;

        }
        .zombie-bar {

            border-radius: 30px;
            font-weight: bold;

            z-index: 100;
            box-shadow: 0 0 40px rgba(68, 204, 136, 0.6);
            display: none;
            animation: popIn 0.5s ease;
        }
        @keyframes popIn {
            from {
                transform: translateX(-50%) scale(0.5);

            .game {
                padding: 12px;
            }

    </style>
</head>
<body>
    <div class="game">
        <h1>🧟 <span>Tower</span>Defense: <span>Zombie</span>Outbreak <span style="font-size:16px;color:#888;">ULTIMATE</span></h1>
        <div class="stats" id="stats">
            <div>❤️ Жизни: <span id="lives">100</span></div>
            <div>💰 Ресурсы: <span id="gold">200</span></div>
            <div>📈 Волна: <span id="wave">0</span></div>
            <div>☠️ Убито: <span id="kills">0</span></div>
            <div>🗼 Турели: <span id="towerCount">0</span></div>
            <div>⚔️ Урон: <span id="dmgDisplay">15</span></div>
            <div>📈 Уровень: <span id="lvlDisplay">1</span></div>
            <div>🛡️ Броня: <span id="defDisplay">0</span></div>
            <div>🏆 Достиж.: <span id="achCount">0</span></div>
            <div>⚡ Бафф: <span id="buffDisplay">Нет</span></div>
        </div>

        <canvas id="gameCanvas" width="850" height="500"></canvas>
        <div class="zombie-bar"><div class="fill" id="waveProgress" style="width:0%"></div></div>
        <div class="log" id="log">🧟 Построй турель, чтобы защитить убежище!</div>

        <div class="tabs">
            <button class="active" data-tab="main">⚔️ Оборона</button>
            <button data-tab="shop">🛒 Магазин</button>
            <button data-tab="upgrades">📈 Улучшения</button>
            <button data-tab="buffs">⚡ Баффы</button>
            <button data-tab="stats">📊 Статистика</button>
        </div>

        <div id="tab-main" class="tab-content active">
            <div style="display:flex; gap:4px; margin:4px 0; flex-wrap:wrap;">
                <button class="btn btn-gold" id="nextWaveBtn" style="flex:1;">🧟 Волна</button>
                <button class="btn btn-green" id="towerBtn" style="flex:1;">🔫 Турель (50💰)</button>
                <button class="btn btn-purple" id="sniperBtn" style="flex:1;">🎯 Снайпер (80💰)</button>
                <button class="btn btn-pink" id="flameBtn" style="flex:1;">🔥 Огнемёт (100💰)</button>
                <button class="btn btn-blue" id="laserBtn" style="flex:1;">⚡ Лазер (120💰)</button>
                <button class="btn btn-orange" id="rocketBtn" style="flex:1;">💥 Ракета (150💰)</button>
                <button class="btn btn-red" id="resetBtn" style="flex:1;">🔄 Сброс</button>
            </div>
            <div style="font-size:12px; color:#555;">🏗️ Кликни на карту, чтобы поставить турель</div>
        </div>

        <div id="tab-shop" class="tab-content">
            <div class="shop">
                <button id="buyDmg">⚔️ Урон +5 (30💰)</button>
                <button id="buyDef">🛡️ Броня +3 (20💰)</button>
                <button id="buySpeed">🏃 Скорость +10% (40💰)</button>
                <button id="buyRange">📐 Дальность +10% (35💰)</button>
                <button id="buySplash">💥 Взрывной урон (60💰)</button>
                <button id="buyGold">💰 Зомби +50% ресурсов (45💰)</button>
                <button id="buyHeal">❤️ Восстановить жизни (50💰)</button>
                <button id="buyAmmo">🔫 Боекомплект (40💰)</button>
            </div>
        </div>

        <div id="tab-upgrades" class="tab-content">
            <div id="upgradeList" style="text-align:left;font-size:13px;color:#aaa;"></div>
        </div>

        <div id="tab-buffs" class="tab-content">
            <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;">
                <button class="btn btn-pink" id="buffAtk">💪 Ярость (50💰) +15 урона 15с</button>
                <button class="btn btn-purple" id="buffSpeed">🏃 Ускорение (40💰) турели x2 10с</button>
                <button class="btn btn-gold" id="buffGold">💰 Ресурсы x2 (60💰) 20с</button>
                <button class="btn btn-green" id="buffShield">🛡️ Щит (30💰) неуязвимость 10с</button>
                <button class="btn btn-blue" id="buffCrit">💥 Крит (50💰) 30% шанс x3 15с</button>
                <button class="btn btn-orange" id="buffRegen">💚 Реген (40💰) +5 HP/сек 10с</button>
            </div>
            <div id="buffStatus" style="margin-top:10px;font-size:13px;color:#888;">⚡ Баффы не активны</div>
        </div>

        <div id="tab-stats" class="tab-content">
            <div style="background:#0b0e14;padding:12px;border-radius:16px;border:1px solid #1e2838;text-align:left;">
                <h3 style="color:#44cc88;">📊 Статистика</h3>
                <div id="statsDetails" style="font-size:13px;color:#aaa;margin-top:8px;"></div>
            </div>
        </div>
    </div>

    <div id="achievementPopup" class="achievement-popup"></div>

    <script>
        // ================================================================
        //  TOWER DEFENSE: ZOMBIE OUTBREAK ULTIMATE
        //  Полная версия с новыми турелями, зомби, анимациями,
        //  достижениями, статистикой и сложной волновой системой.
        //  ~1200+ строк чистого кода.
        // ================================================================

        // ----- DOM элементы -----
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const W = canvas.width,
            H = canvas.height;
        const livesEl = document.getElementById('lives');
        const goldEl = document.getElementById('gold');
        const waveEl = document.getElementById('wave');
        const killsEl = document.getElementById('kills');
        const towerCountEl = document.getElementById('towerCount');
        const dmgDisplayEl = document.getElementById('dmgDisplay');
        const lvlDisplayEl = document.getElementById('lvlDisplay');
        const defDisplayEl = document.getElementById('defDisplay');
        const achCountEl = document.getElementById('achCount');
        const buffDisplayEl = document.getElementById('buffDisplay');
        const waveProgressEl = document.getElementById('waveProgress');
        const logEl = document.getElementById('log');
        const statsDetailsEl = document.getElementById('statsDetails');
        const achievementPopup = document.getElementById('achievementPopup');

        // ----- Игрок -----
        let player = {
            lives: 100,
            gold: 200,
            wave: 0,
            kills: 0,
            towerDamage: 15,
            towerRange: 130,
            towerSpeed: 25,
            splash: 0,
            defense: 0,
            goldMultiplier: 1,
            level: 1,
            xp: 0,
            xpNext: 50,
            flameDamage: 8,
            critChance: 0.05,
            critMultiplier: 2,
            regen: 0,
            totalKills: 0,
            totalWaves: 0,
            totalGold: 0,
            towersBuilt: 0,
            bossKills: 0
        };

        // ----- Массивы -----
        let towers = [];
        let enemies = [];
        let projectiles = [];
        let particles = [];
        let effects = [];
        let towerRadius = [];

        // ----- Волны -----
        let waveActive = false;
        let enemiesToSpawn = 0;
        let spawnTimer = 0;
        let spawnDelay = 25;
        let frame = 0;
        let totalEnemiesInWave = 0;
        let enemiesSpawned = 0;
        let bossWave = false;

        // ----- Баффы -----
        let buffs = {
            atk: { active: false, timer: 0, duration: 15, dmgBonus: 15 },
            speed: { active: false, timer: 0, duration: 10, speedMult: 2 },
            gold: { active: false, timer: 0, duration: 20, mult: 2 },
            shield: { active: false, timer: 0, duration: 10 },
            crit: { active: false, timer: 0, duration: 15, chance: 0.3, mult: 3 },
            regen: { active: false, timer: 0, duration: 10, amount: 5 }
        };
        let buffStatusEl = document.getElementById('buffStatus');

        // ----- Достижения -----
        let achievements = {
            kill100: { done: false, name: '💀 Убийца', desc: 'Убей 100 зомби', check: () => player.totalKills >= 100 },
            kill500: { done: false, name: '🔥 Массовый убийца', desc: 'Убей 500 зомби', check: () => player.totalKills >=
                    500 },
            wave10: { done: false, name: '🌊 Волнолом', desc: 'Пройди 10 волн', check: () => player.totalWaves >= 10 },
            wave25: { done: false, name: '🏆 Герой', desc: 'Пройди 25 волн', check: () => player.totalWaves >= 25 },
            towers10: { done: false, name: '🏗️ Строитель', desc: 'Построй 10 турелей', check: () => player.towersBuilt >= 10 },
            towers50: { done: false, name: '👷 Инженер', desc: 'Построй 50 турелей', check: () => player.towersBuilt >= 50 },
            gold1000: { done: false, name: '💰 Богач', desc: 'Собери 1000 золота', check: () => player.totalGold >= 1000 },
            gold5000: { done: false, name: '💎 Магнат', desc: 'Собери 5000 золота', check: () => player.totalGold >= 5000 },
            boss5: { done: false, name: '👑 Охотник на боссов', desc: 'Убей 5 боссов', check: () => player.bossKills >= 5 },
            boss20: { done: false, name: '⚔️ Легенда', desc: 'Убей 20 боссов', check: () => player.bossKills >= 20 }
        };
        let achievementCount = 0;

        // ----- Путь зомби -----
        const path = [
            { x: -30, y: 70 },
            { x: 160, y: 70 },
            { x: 160, y: 230 },
            { x: 460, y: 230 },
            { x: 460, y: 70 },
            { x: 680, y: 70 },
            { x: 680, y: 410 },
            { x: 830, y: 410 }
        ];

        // ----- Лог -----
        function log(msg) {
            logEl.innerHTML = '🧟 ' + msg;
        }

        // ----- Вспомогательные функции -----
        function distanceToSegment(px, py, p1, p2) {
            const dx = p2.x - p1.x,
                dy = p2.y - p1.y;
            const lenSq = dx * dx + dy * dy;
            if (lenSq === 0) return Math.hypot(px - p1.x, py - p1.y);
            let t = ((px - p1.x) * dx + (py - p1.y) * dy) / lenSq;
            t = Math.max(0, Math.min(1, t));
            const cx = p1.x + t * dx,
                cy = p1.y + t * dy;
            return Math.hypot(px - cx, py - cy);
        }

        function spawnParticles(x, y, color, count = 10, speed = 3, life = 30) {
            for (let i = 0; i < count; i++) {
                const angle = Math.random() * Math.PI * 2;
                const spd = Math.random() * speed + 1;
                particles.push({
                    x,
                    y,
                    vx: Math.cos(angle) * spd,
                    vy: Math.sin(angle) * spd,
                    radius: Math.random() * 4 + 2,
                    life: life + Math.random() * 20,
                    maxLife: life + 20,
                    color: color,
                    decay: 0.95 + Math.random() * 0.03
                });
            }
        }

        function spawnEffect(x, y, color, size = 30, duration = 20) {
            effects.push({
                x,
                y,
                radius: size,
                maxRadius: size * 1.5,
                life: duration,
                maxLife: duration,
                color: color,
                alpha: 0.8
            });
        }

        function showAchievement(name) {
            achievementPopup.textContent = '🏆 ' + name + '!';
            achievementPopup.style.display = 'block';
            setTimeout(() => { achievementPopup.style.display = 'none'; }, 3000);
        }

        // ----- Класс Зомби -----
        class Zombie {
            constructor(waveNum, isBoss = false) {
                const baseHp = isBoss ? 80 + waveNum * 15 : 15 + waveNum * 4 + Math.floor(Math.random() * 8);
                const baseSpeed = isBoss ? 0.5 + waveNum * 0.02 : 0.7 + waveNum * 0.03;
                this.pathIndex = 0;
                this.x = path[0].x;
                this.y = path[0].y;
                this.hp = baseHp;
                this.maxHp = this.hp;
                this.speed = baseSpeed + (isBoss ? 0 : Math.random() * 0.2);
                this.gold = isBoss ? 50 + waveNum * 5 : 8 + waveNum * 2 + Math.floor(Math.random() * 4);
                this.alive = true;
                this.radius = isBoss ? 22 : 11;
                this.isBoss = isBoss;
                this.type = isBoss ? 'boss' : (Math.random() < 0.15 ? 'fast' : (Math.random() < 0.1 ? 'tank' : 'normal'));
                if (!isBoss) {
                    if (this.type === 'fast') { this.speed *= 1.6;
                        this.hp *= 0.6;
                        this.maxHp = this.hp; }
                    if (this.type === 'tank') { this.speed *= 0.6;
                        this.hp *= 2.2;
                        this.maxHp = this.hp; }
                } else {
                    this.type = 'boss';
                }
                this.color = this.type === 'fast' ? '#ff66aa' : (this.type === 'tank' ? '#ff8800' : (this.isBoss ?
                    '#ff00ff' : '#44cc88'));
                this.slowTimer = 0;
                this.slowFactor = 1;
            }

            update() {
                if (!this.alive) return;
                if (this.slowTimer > 0) {
                    this.slowTimer--;
                    this.speed *= this.slowFactor;
                }
                const target = this.pathIndex + 1 < path.length ? path[this.pathIndex + 1] : null;
